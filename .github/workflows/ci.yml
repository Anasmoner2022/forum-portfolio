name: Forum checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...
      - run: docker build -t forum-test .
