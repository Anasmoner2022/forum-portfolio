services:
  forum:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - forum-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
volumes:
  forum-data:
